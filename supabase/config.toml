# Reference: https://supabase.com/docs/guides/local-development/cli/config
# Ports are intentionally unset: the CLI assigns per-project ports and remembers them.
project_id = "mistral-bot"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Agent templates and built-in skills arrive in Phase 3.
enabled = false

[realtime]
enabled = true

[studio]
enabled = true

[local_smtp]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "mistralbot://auth-callback"
additional_redirect_urls = ["mistralbot://auth-callback", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Native Sign in with Apple on iOS: client_id is the app bundle ID (comma-separate several).
# The secret is only needed for the web OAuth flow.
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
# per_worker keeps workers alive so EdgeRuntime.waitUntil background work completes locally.
policy = "per_worker"
deno_version = 2

[functions.agent-step]
# Invoked by pg_net with the service-role key; the function verifies the bearer itself.
verify_jwt = false
import_map = "./functions/deno.json"

[functions.chat-send]
verify_jwt = true
import_map = "./functions/deno.json"

[analytics]
enabled = false

[experimental]
stack = true
