name: backend

on:
  push:
    branches: [main]
    paths: ["supabase/**", "contracts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["supabase/**", "contracts/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # config.toml enables the experimental stack engine, which needs a recent CLI.
          version: 2.121.0
      # Docker is available on GitHub runners; only Postgres, Auth, REST and Realtime are needed.
      - run: supabase start --runtime docker -x studio,mail,analytics,pooler,storage,functions
      - run: supabase test db
